name: swift-im-arm64

on:
  push:
    branches: [swift-arm64]
    paths: ['.github/workflows/swift-im-arm64.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    name: swift-im trixie arm64
    steps:
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends debootstrap
      - name: Bootstrap trixie arm64 chroot
        run: |
          sudo debootstrap --arch=arm64 --variant=minbase \
            --include=ca-certificates \
            trixie /chroot-trixie-arm64 \
            http://ftp.de.debian.org/debian
      - name: Build swift-im
        run: |
          set -euxo pipefail
          sudo chroot /chroot-trixie-arm64 /bin/bash -s <<'BUILD'
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          export DEB_BUILD_OPTIONS=nocheck
          test "$(dpkg --print-architecture)" = arm64
          apt-get update
          apt-get install -y --no-install-recommends \
            git git-buildpackage devscripts build-essential fakeroot equivs
          git clone --branch swiften5_debian --single-branch \
            https://github.com/SpectrumIM/swift.git /tmp/swift-im-src
          git clone https://salsa.debian.org/xmpp-team/swift-im.git /tmp/swift-im-packaging
          git -C /tmp/swift-im-packaging checkout --detach 8e9b0ecabea0ee24c13f4d3c3e15f8436638d399
          cd /tmp/swift-im-src
          # Source fixes are already committed on swiften5_debian; do not reapply quilt patches.
          mkdir debian
          git -C /tmp/swift-im-packaging archive HEAD debian \
            | tar -x --exclude=debian/patches
          mk-build-deps --install --remove \
            --tool "apt-get -y --no-install-recommends" debian/control
          gbp buildpackage --git-ignore-branch --git-ignore-new --git-upstream-tree=HEAD -B -us -uc
          BUILD
          sudo mkdir -p /tmp/swift-im-debs
          sudo cp /chroot-trixie-arm64/tmp/*.deb /tmp/swift-im-debs/
      - name: Verify arm64 packages
        run: |
          set -euxo pipefail
          for deb in /tmp/swift-im-debs/*.deb; do
            test -f "$deb"
            dpkg-deb -f "$deb" Package Version Architecture
            test "$(dpkg-deb -f "$deb" Architecture)" = arm64
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: swift-im-trixie-arm64-debs
          path: /tmp/swift-im-debs/*.deb
          if-no-files-found: error
          retention-days: 14
