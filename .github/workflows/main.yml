name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
jobs:
  linux-glibc:
    runs-on: ubuntu-latest
    services:
      ircd:
        image: linuxserver/ngircd
        ports:
          - 6667:6667
    steps:
    - uses: actions/checkout@v7

    - name: Start prosody for Slack tests
      run: |
        docker pull cr.spectrum.im/spectrumim/prosody:master
        docker run -d --name prosody \
          -p 5222:5222 -p 5347:5347 \
          -v ${{ github.workspace }}/tests/slack_jabber/prosody.cfg.lua:/etc/prosody/prosody.cfg.lua \
          -v ${{ github.workspace }}/tests/tests_output/localhost:/var/lib/prosody/localhost \
          cr.spectrum.im/spectrumim/prosody:master
        sleep 3
        echo "--- prosody status ---"
        docker ps -a --filter name=prosody
        echo "--- prosody logs ---"
        docker logs prosody 2>&1 || true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build tests
      uses: docker/build-push-action@v7
      with:
        context: .
        target: test
        load: true
        tags: spectrum:tests
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run tests
      run: docker run -tt --network host spectrum:tests
    - name: Prosody logs
      if: always()
      run: docker logs prosody 2>&1 || true
  linux-clang:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Build tests
      run: docker buildx build . --target test-clang -t spectrum:tests-clang
    - name: Run tests
      run: docker run -tt spectrum:tests-clang
  linux-musl:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Build tests
      run: docker buildx build . --target test-musl -t spectrum:tests-musl
    - name: Run tests
      run: docker run -tt --env LANG=en_US.UTF-8 spectrum:tests-musl
  macos:
    if: false
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v7
    - name: Install MacPorts
      run: |
        curl -L -O "https://github.com/macports/macports-base/releases/download/v2.9.0/MacPorts-2.9.0-14-Sonoma.pkg"
        sudo installer -store -pkg MacPorts-2.9.0-14-Sonoma.pkg -target /
        echo "https://github.com/SpectrumIM/ports/archive/refs/tags/v1.0.1.tar.gz" | sudo tee -a /opt/local/etc/macports/sources.conf
    - name: Install dependencies
      run: |
        export PATH=$PATH:/opt/local/bin
        sudo rm -rf /usr/local/*
        sudo port -v selfupdate && sudo port -q install cppunit log4cxx popt jsoncpp protobuf3-cpp pkgconfig boost cmake zlib libswiften
    - name: Configure build
      run: |
        export PATH=$PATH:/opt/local/bin:/usr/local/bin
        cmake -DCMAKE_BUILD_TYPE=MacPorts -DENABLE_TESTS=ON -DCMAKE_UNITY_BUILD=ON .
    - name: Build
      run:  make -j4
    - name: Run tests
      run:  |
        install_name_tool -change libSwiften.4.dylib @rpath/libSwiften.4.dylib tests/libtransport/libtransport_test
        install_name_tool -add_rpath /opt/local/lib tests/libtransport/libtransport_test
        install_name_tool -change libSwiften.4.dylib @rpath/libSwiften.4.dylib libtransport/libtransport.2.0.dylib
        install_name_tool -add_rpath /opt/local/lib libtransport/libtransport.2.0.dylib
        make test
    

  windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        curl -L -O https://packages.spectrum.im/deps32.zip
        7z x deps32.zip
      shell: cmd
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3.0.0
    - name: Configure build
      run: |
        set CMAKE_PREFIX_PATH=%cd%\deps32
        set PATH=%PATH%;%cd%\deps32\bin;%cd%\deps32\tools\bin
        cmake -G "Visual Studio 17 2022" -A Win32 -DCMAKE_UNITY_BUILD=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_TESTS=ON -DENABLE_IRC=OFF -DENABLE_FROTZ=OFF -DENABLE_PURPLE=OFF -DENABLE_MYSQL=OFF -DENABLE_PQXX=OFF -DENABLE_SLACK_FRONTEND=ON -DCMAKE_INSTALL_PREFIX=dist -DCMAKE_CXX_STANDARD=17 .
      shell: cmd
    - name: Build solution
      run:  cmake --build . --config RelWithDebInfo --target install -- /m
    - name: Run tests
      shell: cmd
      run: |
        set PATH=%PATH%;%cd%\deps32\bin;%cd%\dist\bin
        cd dist\bin
        libtransport_test

  linux-debian:
    if: false
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Build from Dockerfile\.trixie
      run: docker build -f Dockerfile\.trixie -t spectrum:trixie \.
